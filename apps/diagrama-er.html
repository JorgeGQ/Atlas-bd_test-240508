function computeLayout(mode){const domains=['Usuarios','Catálogo','Carritos','Órdenes','Pagos','Direcciones y envíos','Postcompra','Auditoría'];const grouped=new Map(domains.map(d=>[d,tables.filter(t=>t.domain===d)]));const gap=85,dims=new Map(tables.map(t=>[t.name,Math.max(220,150+t.columns.length*31)])),pos=new Map();if(mode==='RAD'){const cx=4300,cy=3000,rx=3650,ry=2450;tables.forEach((t,i)=>{const a=-Math.PI/2+2*Math.PI*i/tables.length;pos.set(t.name,{x:cx+Math.cos(a)*rx-220,y:cy+Math.sin(a)*ry-dims.get(t.name)/2})});return pos}if(mode==='LR'){domains.forEach((d,col)=>{let y=140;for(const t of grouped.get(d)){pos.set(t.name,{x:150+col*1000,y});y+=dims.get(t.name)+gap}})}else{let y=140;for(const d of domains){let x=150,rowH=0;for(const t of grouped.get(d)){pos.set(t.name,{x,y});x+=470+gap;rowH=Math.max(rowH,dims.get(t.name))}y+=rowH+gap}}return pos}function computeLayoutOld(mode){const gap=73, dims=new Map(tables.map(t=>[t.name,Math.max(205,130+t.columns.length*28+(t.access?.length>4?18:0))])), parents=new Map(tables.map(t=>[t.name,[]]));for(const t of tables)for(const fk of t.foreignKeys)if(fk.referencesTable!==t.name&&parents.has(fk.referencesTable))parents.get(t.name).push(fk.referencesTable);let pos=new Map();if(mode==='RAD'){const cx=2200,cy=1750,rx=1562.5,ry=1125;tables.forEach((t,i)=>{const a=-Math.PI/2+2*Math.PI*i/tables.length;pos.set(t.name,{x:cx+Math.cos(a)*rx-195,y:cy+Math.sin(a)*ry-dims.get(t.name)/2})});return pos}const rank=new Map(tables.map(t=>[t.name,0]));for(let i=0;i<tables.length;i++)for(const t of tables)for(const p of parents.get(t.name))rank.set(t.name,Math.max(rank.get(t.name),Math.min(5,rank.get(p)+1)));const buckets=new Map();for(const t of tables){let r=rank.get(t.name);if(!buckets.has(r))buckets.set(r,[]);buckets.get(r).push(t)}const keys=[...buckets.keys()].sort((a,b)=>a-b);for(const r of keys){const group=buckets.get(r);let cursor=150;for(const t of group){if(mode==='LR')pos.set(t.name,{x:180+r*700,y:cursor});else pos.set(t.name,{x: function edgePoints(fk,child,parent){const ce=document.getElementById('node-'+qid(child.name)),pe=document.getElementById('node-'+qid(parent.name));if(!ce||!pe)return null;const cRow=ce.querySelector(`.colrow[data-column="${CSS.escape(fk.columns[0])}"]`),pRow=pe.querySelector(`.colrow[data-column="${CSS.escape(fk.referencesColumns[0])}"]`);if(!cRow||!pRow)return null;const a=positions.get(child.name),b=positions.get(parent.name),cY=a.y+cRow.offsetTop+cRow.offsetHeight/2,pY=b.y+pRow.offsetTop+pRow.offsetHeight/2;const cX=a.x+(b.x>=a.x?ce.offsetWidth:0),pX=b.x+(a.x>=b.x?pe.offsetWidth:0);return {x1:cX,y1:cY,x2:pX,y2:pY}}

ttribute('class','edge-mark');m.textContent=txt;edgeSvg.append(m)};const uniqueChild=child.indexes.some(i=>(i.kind==='UNIQUE KEY'||i.kind==='PRIMARY KEY')&&fk.columns.every(c=>i.columns.includes(c)));mark(p.x1+(p.x2>=p.x1?14:-14),p.y1,uniqueChild?(optional?'o|':'||'):(optional?'o<':'|<'));mark(p.x2+(p.x1>=p.x2?14:-14),p.y2,'||');const midx=(p.x1+p.x2)/2,midy=(p.y1+p.y2)/2;const text=`${child.name}.${fk.columns.join('+')} → ${parent.name}.${fk.referencesColumns.join('+')}`;const w=Math.min(260,Math.max(125,text.length*5.8+16));const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');bg.setAttribute('x',midx-w/2);bg.setAttribute('y',midy-9);bg.setAttribute('width',w);bg.setAttribute('height',18);bg.setAttribute('rx',8);bg.setAttribute('class','edge-label-bg');bg.dataset.edge=id;edgeSvg.append(bg);const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x',midx);label.setAttribute('y',midy+3);label.setAttribute('text-anchor','middle');label.setAttribute('class','edge-label');label.dataset.edge=id;label.textContent=text;edgeSvg.append(label)}updateHighlights()}

let motionFrame=0;let zoomLabelValue='',lowDetailActive=false;function transform(){world.style.transform=`translate3d(${state.x}px,${state.y}px,0) scale(${state.zoom})`;const label=Math.round(state.zoom*100)+'%';if(label!==zoomLabelValue){zoomLabelValue=label;document.getElementById('zoomLabel').textContent=label}const low=state.zoom<.55;if(low!==lowDetailActive){lowDetailActive=low;world.classList.toggle('low-detail',low)}drawMini()}function animateCanvas(){motionFrame=0;const ease=drag?1:.18,dx=state.targetX-state.x,dy=state.targetY-state.y,ds=state.targetScale-state.zoom;state.x+=dx*ease;state.y+=dy*ease;state.zoom+=ds*ease;const settled=Math.abs(dx)<.08&&Math.abs(dy)<.08&&Math.abs(ds)<.0005;if(settled){state.x=state.targetX;state.y=state.targetY;state.zoom=state.targetScale}transform();if(!settled)motionFrame=requestAnimationFrame(animateCanvas);else world.classList.remove('moving')}function moveCanvas(x,y,scale=state.targetScale){state.targetX=x;state.targetY=y;state.targetScale=Math.max(.1,Math.min(2,scale));world.classList.add('moving');if(!motionFrame)motionFrame=requestAnimationFrame(animateCanvas)}
function fit(){const shown=tables.filter(t=>{const el=document.getElementById('node-'+qid(t.name));return el&&!el.classList.contains('hidden')});if(!shown.length)return;const minX=Math.min(...shown.map(t=>positions.get(t.name).x)),minY=Math.min(...shown.map(t=>positions.get(t.name).y)),maxX=Math.max(...shown.map(t=>positions.get(t.name).x+document.getElementById('node-'+qid(t.name)).offsetWidth)),maxY=Math.max(...shown.map(t=>positions.get(t.name).y+document.getElementById('node-'+qid(t.name)).offsetHeight)),r=viewport.getBoundingClientRect(),scale=Math.max(.1,Math.min(1.2,(r.width-100)/(maxX-minX),(r.height-150)/(maxY-minY)));moveCanvas((r.width-(maxX-minX)*scale)/2-minX*scale,(r.height-(maxY-minY)*scale)/2-minY*scale,scale)}

function applyFilters(){let count=0;const q=state.query.toLowerCase();for(const t of tables){const el=document.getElementById('node-'+qid(t.name));if(!el)continue;const matches=!q||t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q)||c.type.toLowerCase().includes(q));const f=state.filter==='all'||(state.filter==='data'?t.recordCount>0:t.recordCount===0);const iso=!state.isolated||linked(state.isolated).has(t.name);const userMatch=!state.userFilter||(t.access||[]).some(a=>a.user===state.userFilter);el.classList.toggle('hidden',!matches||!f||!iso||!userMatch);if(matches&&f&&iso&&userMatch)count++}document.getElementById('visibleCount').textContent=count;const empty=document.getElementById('emptyState');empty.textContent=count===0&&state.userFilter?`No hay tablas visibles para ${state.userFilter} con los filtros actuales.`:'No hay tablas que coincidan con los filtros actuales.';empty.hidden=count!==0}

function jumpTo(name,column){const el=document.getElementById('node-'+qid(name));if(!el)return;state.isolated=null;state.selected=name;updateHighlights();const p=positions.get(name),r=viewport.getBoundingClientRect();const scale=Math.max(state.targetScale,.82);moveCanvas(r.width/2-(p.x+195)*scale,r.height/2-(p.y+140)*scale,scale);setTimeout(()=>{const row=el.querySelector(`.colrow[data-column="${CSS.escape(column)}"]`);if(row){row.classList.add('pulse');row.scrollIntoView({block:'nearest'});setTimeout(()=>row.classList.remove('pulse'),1300)}},620);toast(`Referencia a ${name}.${column}`)}
function openDrawer(name,tab='overview'){const t=byName.get(name);if(!t)return;state.drawer=name;document.getElementById('drawerTitle').textContent=t.name;document.getElementById('drawerSub').textContent=`${t.eerType.toUpperCase()} · ${t.engine||'motor no declarado'} · ${t.columns.length} columnas`;const drawer=document.getElementById('drawer');drawer.inert=false;drawer.setAttribute('aria-hidden','false');drawer.classList.add('open');document.getElementById('drawerClose').focus();setTab(tab);}function closeDrawer(){const drawer=document.getElementById('drawer');drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');drawer.inert=true;const node=document.getElementById('node-'+qid(state.drawer));if(node)node.focus();}
function setTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));const t=byName.get(state.drawer);if(!t)return;const total=DB.metrics.recordCount,share=total?t.recordCount/total*100:0;let html='';if(tab==='overview'){html=`<div class="statgrid"><div class="stat"><label>REGISTROS EN RESPALDO</label><strong>${fmt.format(t.recordCount)}</strong></div><div class="stat"><label>PARTICIPACIÓN GLOBAL</label><strong>${share.toFixed(3)}%</strong></div><div class="stat"><label>ATRIBUTOS / ÍNDICES</label><strong>${t.columns.length} / ${t.indexes.length}</strong></div><div class="stat"><label>CLAVES FORÁNEAS</label><strong>${t.foreignKeys.length}</strong></div></div><div class="sharebar"><i style="width:${Math.min(100,share)}%"></i></div><div class="sectiontitle">Anatomía de columnas</div><table class="detailtable"><thead><tr><th>#</th><th>Columna</th><th>Tipo SQL</th><th>Reglas</th></tr></thead><tbody>${t.columns.map(c=>`<tr><td>${c.ordinal}</td><td><code>${esc(c.name)}</code>${c.comment?`<div>${esc(c.comment)}</div>`:''}</td><td><code>${esc(c.type)}</code></td><td>${c.keys.join(' · ')||'—'} · ${c.nullable?'NULL':'NOT NULL'}${c.autoIncrement?' · AUTO_INCREMENT':''}${c.default!==null&&c.default!==undefined?` · DEFAULT ${esc(c.default)}`:''}${c.onUpdate?` · ${esc(c.onUpdate)}`:''}</td></tr>`).join('')}</tbody></table><div class="sectiontitle">Índices completos</div>${t.indexes.map(i=>`<div class="indexcard">${esc(i.name||'—')} · ${esc(i.kind)}<small>${i.columns.map(esc).join(', ')}</small></div>`).join('')||'<div class="empty-note">Sin índices adicionales</div>'}<div class="sectiontitle">Integridad referencial</div>${t.foreignKeys.map(f=>`<div class="indexcard">${esc(f.name||'FOREIGN KEY')}<small>${esc(t.name)}.${esc(f.columns.join(', '))} → ${esc(f.referencesTable)}.${esc(f.referencesColumns.join(', '))}<br>ON DELETE ${esc(f.onDelete)} · ON UPDATE ${esc(f.onUpdate)}</small></div>`).join('')||'<div class="empty-note">Sin claves foráneas</div>'}<div class="sectiontitle">Metadatos de almacenamiento</div><div class="indexcard">ENGINE=${esc(t.engine||'—')} · CHARSET=${esc(t.charset||'—')} · COLLATE=${esc(t.collation||'—')}<small>${esc(t.tableOptions||'')}</small></div>${t.tableComment?`<div class="indexcard">Comentario: ${esc(t.tableComment)}</div>`:''}`}

else {html=`<div class="sectiontitle">Primeras ${t.samples.length} filas disponibles en el dump</div>${t.samples.length?t.samples.map((row,i)=>`<div class="mono" style="margin:5px 0">Fila ${i+1}</div><pre class="samplebox">${esc(JSON.stringify(row.map(v=>v.replace(/\\r/g,'␍').replace(/\\n/g,'␊')),null,2))}</pre>`).join(''):'<div class="empty-note">No hay sentencias INSERT para esta tabla: 0 registros.</div>'}`}
document.getElementById('drawerContent').innerHTML=html;if(tab==='overview'&&t.checks.length){const box=document.createElement('div');box.innerHTML='<div class="sectiontitle">Restricciones CHECK</div>'+t.checks.map(c=>'<div class="indexcard">'+esc(c.name)+'<small>'+esc(c.expression)+'</small></div>').join('');document.getElementById('drawerContent').append(box)}const cp=document.getElementById('copyDDL');if(cp)cp.onclick=async()=>{await navigator.clipboard.writeText(t.ddl);toast('DDL copiado')}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1600)}
function makeExport(){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const visible=tables.filter(t=>!document.getElementById('node-'+qid(t.name)).classList.contains('hidden'));const maxX=Math.max(...visible.map(t=>positions.get(t.name).x+460)),maxY=Math.max(...visible.map(t=>positions.get(t.name).y+100+t.columns.length*28));svg.setAttribute('viewBox',`0 0 ${maxX+80} ${maxY+80}`);svg.setAttribute('xmlns',ns);const bg=document.createElementNS(ns,'rect');bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill','#E8F8F4');svg.append(bg);for(const c of tables)for(const fk of c.foreignKeys){const p=byName.get(fk.referencesTable);if(!p||!visible.includes(c)||!visible.includes(p))continue;const a=positions.get(c.name),b=positions.get(p.name),x1=a.x+440,y1=a.y+94+Math.max(0,c.columns.findIndex(x=>x.name===fk.columns[0]))*28,x2=b.x,y2=b.y+94+Math.max(0,p.columns.findIndex(x=>x.name===fk.referencesColumns[0]))*28,path=document.createElementNS(ns,'path');path.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);path.setAttribute('fill','none');path.setAttribute('stroke','#00C2C7');path.setAttribute('stroke-width','2');svg.append(path)}for(const t of visible){const p=positions.get(t.name),g=document.createElementNS(ns,'g');const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',p.x);rect.setAttribute('y',p.y);rect.setAttribute('width','440');rect.setAttribute('height',92+t.columns.length*28);rect.setAttribute('rx','12');rect.setAttribute('fill','#fffef8');rect.setAttribute('stroke','#111514');g.append(rect);const add=(x,y,text,size,color,fam='sans-serif',weight='400')=>{const z=document.createElementNS(ns,'text');z.setAttribute('x',x);z.setAttribute('y',y);z.setAttribute('fill',color);z.setAttribute('font-size',size);z.setAttribute('font-family',fam);z.setAttribute('font-weight',weight);z.textContent=text;g.append(z)};add(p.x+14,p.y+27,`${icon(t)}  ${t.name}`,14,'#111514','mo function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('exportSvg').onclick=()=>{const s=makeExport();download(new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'}),'db_test-eer.svg')};document.getElementById('exportPng').onclick=()=>{const s=makeExport(),xml=new XMLSerializer().serializeToString(s),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{const vb=s.viewBox.baseVal,c=document.createElement('canvas');c.width=vb.width*2;c.height=vb.height*2;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>download(b,'db_test-eer.png'));URL.revokeObjectURL(url)};img.src=url};
document.getElementById('orientation').onchange=e=>{state.orientation=e.target.value;positions=computeLayout(state.orientation);renderNodes();setTimeout(fit,20)};document.getElementById('fit').onclick=fit;document.getElementById('zoomIn').onclick=()=>zoomAt(state.targetScale*1.2);document.getElementById('zoomOut').onclick=()=>zoomAt(state.targetScale/1.2);document.getElementById('toggleTypes').onclick=e=>{state.showTypes=!state.showTypes;world.classList.toggle('hide-types',!state.showTypes);e.target.textContent=`Tipos ${state.showTypes?'✓':'—'}`};document.getElementById('collapseAll').onclick=e=>{const all=state.collapsed.size!==tables.length;state.collapsed=all?new Set(tables.map(t=>t.name)):new Set();nodesEl.querySelectorAll('.node').forEach(n=>n.classList.toggle('collapsed',all));e.target.textContent=all?'Expandir':'Colapsar';drawEdges()};document.getElementById('drawerClose').onclick=closeDrawer;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.getElementById('recordFilters').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.filter=b.dataset.filter;document.querySelectorAll('#recordFilters button').forEach(x=>x.classList.toggle('on',x===b));applyFilters()};
let searchFrame=0;document.getElementById('search').oninput=e=>{const value=e.target.value.trim();cancelAnimationFrame(searchFrame);searchFrame=requestAnimationFrame(()=>{state.query=value;applyFilters();if(state.query){const first=tables.find(t=>t.name.toLowerCase().includes(state.query.toLowerCase())||t.columns.some(c=>c.name.toLowerCase().includes(state.query.toLowerCase())||c.type.toLowerCase().includes(state.query.toLowerCase())));if(first){state.selected=first.name;updateHighlights()}}})};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search').focus()}if(e.key==='Escape'){closeDrawer();document.getElementById('search').value='';state.query='';state.selected=null;state.isolated=null;updateHighlights()}});
let coastFrame=0,drag=null;viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.target.closest('.toolbar-float')||e.target.closest('.drawer')||e.target.closest('.zoomhud')||e.target.closest('.minimap'))return;if(coastFrame){cancelAnimationFrame(coastFrame);coastFrame=0}if(motionFrame){cancelAnimationFrame(motionFrame);motionFrame=0}world.classList.remove('moving');state.targetX=state.x;state.targetY=state.y;state.targetScale=state.zoom;drag={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,sx:state.targetX,sy:state.targetY,last:performance.now(),vx:0,vy:0};viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),dt=Math.max(1,now-drag.last),dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.vx=(e.clientX-drag.lastX)/dt;drag.vy=(e.clientY-drag.lastY)/dt;drag.lastX=e.clientX;drag.lastY=e.clientY;drag.last=now;moveCanvas(drag.sx+dx,drag.sy+dy,state.targetScale)});viewport.addEventListener('pointerup',()=>{if(!drag)return;let {vx,vy}=drag;drag=null;viewport.classList.remove('dragging');const coast=()=>{vx*=.91;vy*=.91;if(Math.abs(vx)+Math.abs(vy)<.025){coastFrame=0;return}moveCanvas(state.targetX+vx*16,state.targetY+vy*16,state.targetScale);coastFrame=requestAnimationFrame(coast)};coastFrame=requestAnimationFrame(coast)});viewport.addEventListener('pointercancel',()=>{if(!drag)return;drag=null;viewport.classList.remove('dragging')});viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(state.targetScale*Math.exp(-e.deltaY*.0015),e.clientX-viewport.getBoundingClientRect().left,e.clientY-viewport.getBoundingClientRect().top)},{passive:false});document.getElementById('minimap').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),maxX=Math.max(...tables.map(t=>positions.get(t.name).x+440)),maxY=Math.max(...tables.map(t=>positions.get(t.name).y+Math.max(205,150+t.columns.length*31))),s=Math.min(356/maxX,220/maxY),sx=(e.clientX-r.left-12)/s,sy=(e.clientY-r.top-10)/s;moveCanvas(viewport.clientWidth/2-sx*state.targetScale,viewport.clientHeight/2-sy*state.targetScale,state.targetScale)};
for(const [id,value] of [['metric-tables',DB.metrics.tableCount],['metric-columns',DB.tables.reduce((n,t)=>n+t.columns.length,0)],['metric-rows',fmt.format(DB.metrics.recordCount)],['metric-fks',DB.metrics.foreignKeyCount]])document.getElementById(id).textContent=value;document.getElementById('dbmeta').textContent=`${DB.database.toUpperCase()} · MYSQL DUMP · ${DB.source}`;document.getElementById('topFive').textContent='Top 5 · '+DB.metrics.topTables.map((t,i)=>`${i+1}. ${t.name} ${fmt.format(t.records)}`).join(' · ');const userSelect=document.getElementById('userFilter');for(const u of DB.accessControl.users){const option=document.createElement('option');option.value=u.name;option.textContent=u.name+(u.roles.length?' · '+u.roles.join(', '):'');userSelect.append(option)}userSelect.onchange=e=>{state.userFilter=e.target.value;world.classList.toggle('user-filtered',!!state.userFilter);applyFilters();fit()};renderNodes();transform();setTimeout(fit,80);
